# ====================================================================
# DOCKER COMPOSE ORCHESTRATION - HỆ THỐNG QUẢN LÝ CHI TIÊU (ĐỀ 38)
# Học phần: Triển khai và quản trị hệ thống phần mềm
# Sinh viên: Trần Mạnh Dũng | MSSV: DTC245160020 | Lớp: K23.K1.KHMT K23A
# ====================================================================

version: '3.8'

services:
  # ------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL 16
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_tracker_db
      POSTGRES_USER: dung_admin
      POSTGRES_PASSWORD: SecretPassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - expense_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dung_admin -d expense_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 2. GIAO DIỆN QUẢN TRỊ CSDL PGADMIN 4
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expense_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dtc245160020@ictu.edu.vn
      PGADMIN_DEFAULT_PASSWORD: PgAdminPassword2026!
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 3. BACKEND RESTful API (NODE.JS EXPRESS + PROMETHEUS METRICS)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://dung_admin:SecretPassword2026!@postgres:5432/expense_tracker_db
      JWT_SECRET: expense_tracker_jwt_secret_key_dtc245160020_2026
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 4. FRONTEND WEB CLIENT (REACT 18 + VITE + TAILWIND)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 5. NGINX REVERSE PROXY & HARDENING GATEWAY
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: expense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 6. GIÁM SÁT METRICS: PROMETHEUS
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: expense_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 7. TRỰC QUAN HÓA GIÁM SÁT: GRAFANA
  # ------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: expense_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 8. QUẢN TRỊ LOG TẬP TRUNG: GRAFANA LOKI
  # ------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: expense_loki
    restart: unless-stopped
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - expense_net

  # ------------------------------------------------------------------
  # 9. THU THẬP LOG: PROMTAIL
  # ------------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: expense_promtail
    restart: unless-stopped
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - expense_net

# Khai báo Volume lưu trữ dữ liệu bền vững (Persistent Data)
volumes:
  pgdata:
  promdata:
  grafanadata:
  nginx_logs:

# Mạng ảo riêng cách ly các dịch vụ (Isolated Bridge Network)
networks:
  expense_net:
    driver: bridge
